name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  # Fetch git dependencies (the ../valyria Core crates) with the system `git`
  # rather than cargo's built-in fetcher, which has been seen to stall for
  # tens of minutes on that repo in the hosted runners.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  packages:
    name: Shared packages (codegen · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - run: npm run codegen
      # codegen output is committed; fail if it drifted from the schemas.
      - run: git diff --exit-code packages/protocol/src/generated

      - run: npm run typecheck
      - run: npm test

  rust:
    name: Rust (fmt · clippy · test · gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The walking-skeleton integration test self-skips here: no VALYRIA_BIN and
      # no ../valyria checkout. It runs in the release pipeline against the
      # bundled Core binary.

      - name: Gates (check-layering · verify-core · check-protocol · check-extension)
        run: cargo run -q -p xtask -- all

  rust-windows:
    name: Rust on Windows (bridge-host tier-3 · gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # Scope: prove valyria-bridge + valyria-bridge-host compile and lint clean
      # on Windows (the tier-3 `cfg!(windows)` refusal path — CORE-INTERFACE G9)
      # and that the gates run. Not `cargo test`: the bridge's lib tests assume a
      # Unix socket + a real shell.
      - run: cargo build -p valyria-bridge -p valyria-bridge-host -p xtask --all-targets --locked
      - run: cargo clippy -p valyria-bridge -p valyria-bridge-host -p xtask --all-targets --locked -- -D warnings
      - run: cargo run -q -p xtask -- all

  deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # deny.toml at the repo root; ignores are documented there.

  # NOTE: the §32 "runs offline once deps are fetched" guarantee was previously
  # an `offline` job here (cut outbound network with iptables, then run the unit
  # / build / xtask layers). It hung ~45 min on the hosted runner on every
  # attempt — moving between `cargo fetch` and `npm ci` as the config changed,
  # with the killed job's logs 404ing so the root cause was never visible. It
  # was advisory (`continue-on-error`) and its substance is already covered by
  # the `node` and `rust` jobs (npm test / build, cargo test --workspace, xtask
  # all). §32 is now a release-time manual check — see docs/RELEASING.md.

  # --- Code-OSS fork path (docs/ARCHITECTURE-VSCODE.md) --------------------

  extension:
    name: Valyria extension (typecheck · test · bundle · size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the extension builds without the vscode/ tree
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20"
      # The extension's tsc follows imports into the @valyria/* source packages
      # (they ship TS, no build step), so their deps — zod, and @valyria/protocol
      # for @valyria/state — must resolve. That's the repo-root workspace install.
      - run: npm ci
      - run: npm ci
        working-directory: extension
      - run: npm run check
        working-directory: extension
      # `npm test` has a `pretest` that runs the esbuild build, so the webview
      # render / axe tests (which load out/webviews/*.js into jsdom) and the
      # bundle-size budget both see a fresh build.
      - run: npm test
        working-directory: extension
      - name: Bundle-size budget
        run: bash scripts/check-bundle-size.sh

  branded-editor:
    name: Branded Code-OSS (bootstrap · overlay · offline check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20"
      - name: Icon tooling (Pillow for scripts/gen-icons.py)
        run: python3 -m pip install --user Pillow
      - name: Bootstrap (submodule + overlay + patches)
        run: scripts/bootstrap.sh
      - name: Offline guarantee (static)
        run: scripts/verify-offline.sh
      # The full `npm ci && npm run compile` in vscode/ + the per-OS installer
      # build run on dedicated (self-hosted / larger) runners — see
      # docs/PACKAGING.md. This job only proves the branded tree assembles and
      # phones home to nothing.
