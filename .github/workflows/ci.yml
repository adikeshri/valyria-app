name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  node:
    name: Node (codegen · typecheck · test · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - run: npm run codegen
      # codegen output is committed; fail if it drifted from the schemas.
      - run: git diff --exit-code packages/protocol/src/generated

      - run: npm run typecheck
      - run: npm test
      - run: npm run lint -w desktop
      - run: npm run build -w desktop

  rust:
    name: Rust (fmt · clippy · test · gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The walking-skeleton integration test self-skips here: no VALYRIA_BIN and
      # no ../valyria checkout. It runs in the release pipeline against the
      # bundled Core binary.

      - name: Gates (check-layering · verify-core · check-protocol · check-d7 · check-error-strings · check-a11y)
        run: cargo run -q -p xtask -- all

  rust-windows:
    name: Rust on Windows (bridge transport · gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # The Windows-specific paths live in valyria-bridge (named-pipe transport
      # address, adopt/liveness probes — CORE-INTERFACE G9 / D14). xtask carries
      # the gates. The full Tauri desktop build for Windows is exercised by the
      # release pipeline, not here.
      - run: cargo clippy -p valyria-bridge -p xtask --all-targets --locked -- -D warnings
      - run: cargo test -p valyria-bridge -p xtask --locked
      - run: cargo run -q -p xtask -- all

  deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # deny.toml at the repo root; ignores are documented there.

  offline:
    name: Offline (§32 — unit + build with no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev patchelf build-essential

      # Warm every cache while the network is still up.
      - run: npm ci
      - run: cargo fetch --locked

      # Drop outbound network (loopback stays up), then prove the unit / pure /
      # build layers need nothing more. A from-scratch offline build is
      # impossible — deps must be fetched once — see docs/RELEASING.md.
      - name: Cut outbound network
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A INPUT -i lo -j ACCEPT
          sudo iptables -P OUTPUT DROP
      - run: npm test
      - run: npm run build -w desktop
      - run: cargo test --workspace --offline --locked
      - run: cargo run -q -p xtask -- all
