name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  # Fetch git dependencies (the ../valyria Core crates) with the system `git`
  # rather than cargo's built-in fetcher, which stalls for ~45 min on that
  # repo in the hosted runners (the `Offline` job's cold `cargo fetch`).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  node:
    name: Node (codegen · typecheck · test · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - run: npm run codegen
      # codegen output is committed; fail if it drifted from the schemas.
      - run: git diff --exit-code packages/protocol/src/generated

      - run: npm run typecheck
      - run: npm test
      - run: npm run lint -w desktop
      - run: npm run build -w desktop

  rust:
    name: Rust (fmt · clippy · test · gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          # Shared with the `offline` job so it restores a warm ~/.cargo
          # (registry + the ../valyria git dep) instead of a cold fetch.
          shared-key: linux

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The walking-skeleton integration test self-skips here: no VALYRIA_BIN and
      # no ../valyria checkout. It runs in the release pipeline against the
      # bundled Core binary.

      - name: Gates (check-layering · verify-core · check-protocol · check-d7 · check-error-strings · check-a11y)
        run: cargo run -q -p xtask -- all

  rust-windows:
    name: Rust on Windows (bridge transport · gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # Scope: prove the Windows-specific code in valyria-bridge *compiles and
      # lints* clean (named-pipe transport address, adopt/liveness probes —
      # CORE-INTERFACE G9 / D14) and that the gates run. Not `cargo test`: the
      # bridge's lib tests spawn a real interactive shell (PTY) and assume a
      # Unix socket path — that is runtime behaviour a Windows box would have
      # to validate, and it is not what this job is for. The full Tauri
      # desktop build for Windows is exercised by the release pipeline.
      - run: cargo build -p valyria-bridge -p xtask --all-targets --locked
      - run: cargo clippy -p valyria-bridge -p xtask --all-targets --locked -- -D warnings
      - run: cargo run -q -p xtask -- all

  deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # deny.toml at the repo root; ignores are documented there.

  offline:
    name: Offline (§32 — unit + build with no network)
    runs-on: ubuntu-latest
    needs: [rust]
    # Advisory, not a merge gate. `needs: [rust]` runs this after the `Rust` job,
    # and the shared `rust-cache` key (`linux`) restores the ~/.cargo registry +
    # git db that job already warmed by compiling the whole workspace + all
    # targets — so no `cargo fetch` is needed here. An explicit pre-cut `cargo
    # fetch` used to live here and stalled ~45 min on the ../valyria git
    # dependency in the hosted runner (log blobs 404, root cause never visible);
    # dropping it removes the stall while still proving the §32 guarantee: the
    # unit / pure / build layers run with outbound network cut. `continue-on-error`
    # stays as a backstop in case the restored cache ever misses a crate — that
    # now fails fast and legibly instead of hanging.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev patchelf build-essential

      # npm deps are the one thing the shared rust-cache doesn't cover — install
      # them while the network is still up (setup-node's npm cache keeps it fast).
      - run: npm ci

      # Drop outbound network (loopback stays up), then prove the unit / pure /
      # build layers need nothing more. The Rust deps come from the rust-cache
      # restored above; a from-scratch offline build is still impossible — deps
      # must be fetched once — see docs/RELEASING.md.
      - name: Cut outbound network
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A INPUT -i lo -j ACCEPT
          sudo iptables -P OUTPUT DROP
      - run: npm test
      - run: npm run build -w desktop
      - run: cargo test --workspace --offline --locked
      - run: cargo run -q -p xtask -- all
