name: Release

# Builds a `valyria` Core runtime binary from the Core repo, bundles it into the
# Valyria App as a Tauri sidecar (docs/INTEGRATION.md D-INT-1 / §7), produces the
# native installer per platform, and publishes them.
#
#   .dmg / .app        macOS (arm64 + x86_64)
#   .deb / .AppImage   Linux x86_64
#   .msi / .exe        Windows x86_64 (tier 3 — installs, refuses to start a
#                      session; the bundled valyria.exe cannot `serve`, G9)
#
#   push a `v*` tag        -> draft GitHub Release with installers attached
#   manual dispatch        -> installers kept as workflow artifacts only
#
# A release bundles the Core revision pinned in core.lock.json — the one this
# app was built and tested against (INTEGRATION §3). Only an explicit manual
# dispatch with core_ref=main (or a SHA) builds against a different Core.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      core_ref:
        description: >-
          Core git ref to build the runtime from. `pinned` (default) reads
          core.lock.json's git_rev — reproducible. Pass `main` or a SHA to
          build against a different Core.
        default: pinned
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Both repos pin this (rust-toolchain.toml here, ../valyria/rust-toolchain.toml).
  RUST_TOOLCHAIN: "1.97.1"
  CORE_REPO: adikeshri/valyria

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            rust_target: aarch64-apple-darwin
            exe: ""
          - os: macos-latest
            label: macOS (Intel)
            rust_target: x86_64-apple-darwin
            exe: ""
          - os: ubuntu-22.04
            label: Linux
            rust_target: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-latest
            label: Windows
            rust_target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout valyria-app
        uses: actions/checkout@v4

      - name: Resolve Core ref
        id: core
        shell: bash
        run: |
          # Tag pushes carry no inputs -> default to the pinned Core revision.
          ref='${{ github.event.inputs.core_ref || 'pinned' }}'
          if [ "$ref" = "pinned" ]; then
            ref="$(node -p "require('./core.lock.json').git_rev")"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Core ref: $ref"

      - name: Checkout Core (${{ steps.core.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ steps.core.outputs.ref }}
          path: core
          fetch-depth: 1

      - name: Record Core SHA
        id: core_sha
        shell: bash
        run: |
          sha="$(git -C core rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Core SHA: $sha"

      - name: Rust ${{ env.RUST_TOOLCHAIN }} (+ ${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libfuse2 \
            file \
            patchelf \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          # The app's src-tauri crate is a member of the repo-root Cargo
          # workspace, so its build output lands in <repo>/target, not
          # apps/desktop/src-tauri/target.
          workspaces: |
            . -> target
            core -> target
          key: ${{ matrix.rust_target }}-${{ steps.core_sha.outputs.sha }}

      - name: Build Core runtime (valyria)
        shell: bash
        run: |
          cargo build --release --locked --bin valyria \
            --manifest-path core/Cargo.toml \
            --target ${{ matrix.rust_target }}

      - name: Stage Core sidecar
        shell: bash
        run: |
          src="core/target/${{ matrix.rust_target }}/release/valyria${{ matrix.exe }}"
          dst_dir="apps/desktop/src-tauri/binaries"
          dst="$dst_dir/valyria-${{ matrix.rust_target }}${{ matrix.exe }}"
          mkdir -p "$dst_dir"
          cp "$src" "$dst"
          chmod +x "$dst" || true
          ls -l "$dst"

      - name: Write Core provenance
        shell: bash
        run: |
          cat > apps/desktop/src-tauri/core-provenance.json <<EOF
          {
            "core_repo": "https://github.com/${{ env.CORE_REPO }}",
            "core_ref": "${{ steps.core.outputs.ref }}",
            "core_sha": "${{ steps.core_sha.outputs.sha }}",
            "rust_toolchain": "${{ env.RUST_TOOLCHAIN }}",
            "target": "${{ matrix.rust_target }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat apps/desktop/src-tauri/core-provenance.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Single root lockfile — this is an npm workspace (INTEGRATION §9).
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        # `npm ci` at the workspace root installs apps/desktop too; tauri-action's
        # beforeBuildCommand (`npm run build`) then runs against it.
        run: npm ci

      - name: Signing status
        id: sign
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "status=signed & notarized" >> "$GITHUB_OUTPUT"
          else
            echo "status=unsigned (no APPLE_* secrets configured)" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "updater=updater artifacts signed (latest.json + .sig attached)" >> "$GITHUB_OUTPUT"
          else
            echo "updater=no updater artifacts (TAURI_SIGNING_PRIVATE_KEY not set)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installers (+ draft release on a tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization — active when the secrets exist.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (tauri.conf.json plugins.updater.pubkey).
          # Empty when the secret is unset — tauri-action then just skips
          # latest.json/.sig, same graceful degradation as the APPLE_* path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: >-
            --target ${{ matrix.rust_target }}
            --config src-tauri/tauri.release.conf.json
          # Only a real `v*` tag cuts a Release. Manual runs build only; their
          # installers are uploaded as workflow artifacts below.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: |
            Bundled Core runtime: `${{ steps.core_sha.outputs.sha }}`
            (ref `${{ steps.core.outputs.ref }}` of ${{ env.CORE_REPO }})

            macOS builds: ${{ steps.sign.outputs.status }}.
            Updater: ${{ steps.sign.outputs.updater }}.
            Windows is tier 3 — the installer runs and explains itself; the
            bundled runtime cannot serve over a Unix socket (G9).

            Draft release — review the attached installers, then publish.
          releaseDraft: true
          prerelease: false

      # docs/PLAN.md §9 — installer under 120 MB per platform (models excluded;
      # the sidecar is a ~15 MB runtime today). Fails the release if it grows.
      - name: Bundle-size gate (< 120 MB)
        shell: bash
        run: |
          root="target/${{ matrix.rust_target }}/release/bundle"
          limit=$((120 * 1024 * 1024))
          fail=0
          while IFS= read -r f; do
            bytes=$(wc -c < "$f")
            mb=$(( bytes / 1024 / 1024 ))
            if [ "$bytes" -gt "$limit" ]; then
              echo "::error file=$f::installer is ${mb} MB (> 120 MB budget)"
              fail=1
            else
              echo "ok: $f — ${mb} MB"
            fi
          done < <(find "$root" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' -o -name '*.app.tar.gz' \))
          exit $fail

      - name: Upload installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: valyria-app-${{ matrix.rust_target }}
          path: target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: error
