# Cargo workspace for the app's Rust side: the Core protocol bridge and the
# stdio front end the Valyria VS Code extension spawns. The Core tree at
# ../valyria is a SEPARATE workspace and is never a member here — the bridge
# reaches Core only through the `valyria-protocol` git dependency pinned in
# core.lock.json (docs/ARCHITECTURE-VSCODE.md).
[workspace]
resolver = "2"
members = [
    "crates/valyria-bridge",
    "crates/valyria-bridge-host",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/adikeshri/valyria-app"

[workspace.dependencies]
# Core wire contract. The ONLY Core crates the app may depend on (D2).
# Pinned to core.lock.json's git_rev; a bump moves this rev in the same PR.
# Bumped for the CORE-INTERFACE gap closure (protocol 1.0.0 -> 1.9.0,
# gaps G1-G15). Points at the head of the Core gap-closure branch stack
# until those PRs land on Core `main`, at which point this rev moves to
# the merge commit with no other change.
valyria-protocol = { git = "https://github.com/adikeshri/valyria.git", rev = "865f98e30b05a6950eb5b61656f042b6f248a33d" }
valyria-types = { git = "https://github.com/adikeshri/valyria.git", rev = "865f98e30b05a6950eb5b61656f042b6f248a33d" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
