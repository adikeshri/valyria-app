# Cargo workspace for the app's Rust side: the Core protocol bridge and the
# stdio front end the Valyria VS Code extension spawns. The Core tree at
# ../valyria is a SEPARATE workspace and is never a member here — the bridge
# reaches Core only through the `valyria-protocol` git dependency pinned in
# core.lock.json (docs/ARCHITECTURE-VSCODE.md).
[workspace]
resolver = "2"
members = [
    "crates/valyria-bridge",
    "crates/valyria-bridge-host",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/adikeshri/valyria-app"

[workspace.dependencies]
# Core wire contract. The ONLY Core crates the app may depend on (D2).
# Pinned to core.lock.json's git_rev; a bump moves this rev in the same PR.
# Protocol 1.12.0 — real local inference (model_server_* / engine_install_*
# events, model_inference capability). Pinned to a commit on Core's
# `feat/local-inference` branch (not yet merged to Core's main) rather than
# a local path patch, so CI — which has no sibling ../valyria checkout —
# can actually resolve the dependency. Move this rev to the merged main SHA
# once that Core PR lands.
valyria-protocol = { git = "https://github.com/adikeshri/valyria.git", rev = "c01633a6aee543abc7276fed2e4ba4f7adf36001" }
valyria-types = { git = "https://github.com/adikeshri/valyria.git", rev = "c01633a6aee543abc7276fed2e4ba4f7adf36001" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
