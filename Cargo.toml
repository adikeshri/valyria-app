# Cargo workspace for the app's Rust side: the Core protocol bridge and the
# stdio front end the Valyria VS Code extension spawns. The Core tree at
# ../valyria is a SEPARATE workspace and is never a member here — the bridge
# reaches Core only through the `valyria-protocol` git dependency pinned in
# core.lock.json (docs/ARCHITECTURE-VSCODE.md).
[workspace]
resolver = "2"
members = [
    "crates/valyria-bridge",
    "crates/valyria-bridge-host",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/adikeshri/valyria-app"

[workspace.dependencies]
# Core wire contract. The ONLY Core crates the app may depend on (D2).
# Pinned to core.lock.json's git_rev; a bump moves this rev in the same PR.
# Bumped for protocol 1.11.0 — license-gated + cancellable model install
# (model_install_cancel, ModelInstallRequest.accept_license, license_text /
# license_accepted_at_ms on model_inspect, display_name / parameters_b /
# context_length / active_roles on model_list).
valyria-protocol = { git = "https://github.com/adikeshri/valyria.git", rev = "50a6bb8cbfddea985e90f233d44cba3dd955ccdd" }
valyria-types = { git = "https://github.com/adikeshri/valyria.git", rev = "50a6bb8cbfddea985e90f233d44cba3dd955ccdd" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# TEMPORARY (docs/MODEL-SETUP-PLAN.md's precedent): developing against the
# local Core checkout at ../valyria while its model-inference work (protocol
# 1.12.0 — model_server_* / engine_install_* events) is still uncommitted
# there. Remove this patch and move the two `rev`s above to the merged SHA
# in the same PR once that Core branch lands. core.lock.json's `git_rev`
# deliberately still names the last real landed commit until then.
[patch."https://github.com/adikeshri/valyria.git"]
valyria-protocol = { path = "../valyria/crates/valyria-protocol" }
valyria-types = { path = "../valyria/crates/valyria-types" }
