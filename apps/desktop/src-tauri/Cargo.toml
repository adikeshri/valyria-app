[package]
name = "valyria-desktop"
version = "0.1.0"
description = "Valyria — the desktop application for a local-first autonomous software engineer"
authors = ["Valyria"]
license = "Apache-2.0"
repository = "https://github.com/adikeshri/valyria-app"
edition = "2021"
# Matches Core's pinned toolchain — the bundled `valyria` sidecar is built from
# Core, so the host build tracks it too. See docs/INTEGRATION.md RI3.
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "valyria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
valyria-bridge = { path = "../../../crates/valyria-bridge" }
